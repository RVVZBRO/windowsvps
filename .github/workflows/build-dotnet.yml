name: Build VZ Direct Studio Hosting Windows x64
on:
  push:
    branches: [vz-neptunnel-dotnet]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout VZ
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and publish self-contained Windows app
        run: dotnet publish VZNepTunnel/VZNepTunnel.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Include quick-start
        shell: pwsh
        run: |
          Copy-Item DIRECT-HOSTING.txt publish/DIRECT-HOSTING.txt
          if (!(Test-Path publish/VZ.exe)) { throw "VZ.exe was not generated." }
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath VZ-Direct-Hosting-Windows-x64.zip -CompressionLevel Optimal
      - name: Upload portable VZ build
        uses: actions/upload-artifact@v4
        with:
          name: VZ-Direct-Hosting-Windows-x64
          path: VZ-Direct-Hosting-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
